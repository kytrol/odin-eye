name: .NET Build PR

on:
  pull_request:
    branches: [ "main" ]

env:
  # Empty on any fork that hasn't configured this secret (it's not copied
  # from upstream automatically) -- gates the nuget-publish steps below,
  # which are upstream-specific and unrelated to validating the build.
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set short git commit SHA
        id: vars
        run: |
          $calculatedSha = git rev-parse --short ${{ github.event.pull_request.head.sha }}
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $env:GITHUB_ENV
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5
      - name: Restore Packages
        run: nuget restore OdinEye.sln
      - name: Build solution
        run: msbuild OdinEye.sln -t:rebuild -property:Configuration=Release

      - name: Run OdinEye.Client test suite
        # NUnitLite console runner -- no `dotnet test` involved, matching
        # the rest of this repo's old-style-csproj/packages.config toolchain.
        run: .\src\OdinEye.Client.Tests\bin\Release\OdinEye.Client.Tests.exe

      - name: Run OdinEye test suite
        run: .\src\OdinEye.Tests\bin\Release\OdinEye.Tests.exe

      - name: Generate beta version
        id: version
        uses: paulhatch/semantic-version@v5.3.0
        with:
          version_format: "${major}.${minor}.${patch}-beta.${{ env.COMMIT_SHORT_SHA }}"

      # Publishes a beta OdinEye.Models package to nuget.org -- upstream-
      # specific, and only runs if NUGET_API_KEY is actually configured on
      # this repo (it isn't on every fork).
      - uses: actions/setup-dotnet@v3
        if: ${{ env.NUGET_API_KEY != '' }}
        with:
          dotnet-version: '6.0.x'
      - name: Generate nuget package
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet pack src/OdinEye.Models/OdinEye.Models.csproj -p:Version='${{ steps.version.outputs.version }}' --configuration Release -o nupkg
      - name: Upload nuget package
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push .\nupkg\*.nupkg -k $env:NUGET_API_KEY -s https://api.nuget.org/v3/index.json